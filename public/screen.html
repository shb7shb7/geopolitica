<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geopolitica · Écran</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/screen.css">
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/js/screen.js"></script>
</head>
<body>

<div id="start-hint" class="start-hint">Cliquez n'importe où pour activer le son des vidéos · <b>F</b> plein écran</div>

<!-- Attente -->
<section class="view" id="view-setup">
  <div class="center-col">
    <div class="pulse-ring"></div>
    <h1 class="logo hero-logo">Geopolitica</h1>
    <p class="hero-sub">En attente du maître du jeu</p>
  </div>
</section>

<!-- Inscriptions -->
<section class="view" id="view-draft">
  <div class="draft-layout">
    <div class="join-panel">
      <h1 class="logo" style="font-size:44px">Geopolitica</h1>
      <p class="hero-sub" style="margin:0">Rejoignez la partie</p>
      <img class="qr" id="qr" alt="QR code pour rejoindre">
      <div class="join-url" id="join-url"></div>
      <div class="label" style="text-align:center;margin-top:8px">Code de session</div>
      <div class="join-code" id="join-code"></div>
    </div>
    <div class="draft-right">
      <div class="map-frame" id="draft-map"></div>
      <div class="team-chips" id="draft-teams"></div>
    </div>
  </div>
</section>

<!-- Prospérité -->
<section class="view" id="view-prosperity">
  <header class="scr-head">
    <span class="logo" style="font-size:22px">Geopolitica</span>
    <span class="badge badge-gold big-badge" id="pr-badge"></span>
    <span class="grow"></span>
    <span class="scr-timer num" id="pr-timer"></span>
  </header>
  <div class="pros-layout">
    <div class="pros-left">
      <div class="card period-card">
        <div class="overline" id="pr-overline"></div>
        <h2 class="period-name" id="pr-name"></h2>
        <p class="period-desc" id="pr-desc"></p>
        <div id="pr-happened"></div>
        <div class="hint-big" id="pr-hint"></div>
      </div>
      <div class="bar timer-bar"><i id="pr-bar"></i></div>
    </div>
    <div class="card lb-card">
      <div class="card-title">Classement</div>
      <div id="pr-lb" class="lb"></div>
    </div>
  </div>
</section>

<!-- Négociation -->
<section class="view" id="view-negotiation">
  <header class="scr-head">
    <span class="logo" style="font-size:22px">Geopolitica</span>
    <span class="badge badge-blue big-badge">🕊️ Négociation</span>
    <span class="grow"></span>
    <span class="scr-timer num" id="ng-timer"></span>
  </header>
  <div class="negoc-layout">
    <div class="reveal" id="ng-reveal"></div>
    <div class="card">
      <div class="card-title">Classement avant la guerre</div>
      <div class="lb" id="ng-list"></div>
      <div class="card-title" style="margin-top:16px">Alliances</div>
      <div id="ng-alliances" class="small"></div>
    </div>
  </div>
</section>

<!-- Guerre -->
<section class="view" id="view-war">
  <header class="war-ticker" id="war-ticker"></header>
  <div class="war-layout">
    <div class="map-frame war-map" id="war-map"></div>
    <aside class="war-side">
      <div class="card"><div class="card-title">Nations</div><div id="war-nations" class="lb"></div></div>
      <div class="card"><div class="card-title">Derniers combats</div><div id="war-feed"></div></div>
    </aside>
  </div>
</section>

<!-- Victoire -->
<section class="view" id="view-winner">
  <div class="confetti" id="confetti"></div>
  <div class="center-col">
    <div id="win-flags" class="win-flags"></div>
    <h1 class="win-title" id="win-title"></h1>
    <p class="hero-sub" id="win-sub"></p>
    <div class="win-lb" id="win-lb"></div>
  </div>
</section>

<!-- Choix stratégique (surimpression) -->
<div class="choice-overlay" id="choice-overlay" hidden></div>

<!-- Vidéo -->
<div class="video-overlay" id="video-overlay" hidden>
  <video id="video" playsinline preload="auto"></video>
  <div class="video-bar"><i id="video-bar"></i></div>
  <button class="skip" id="video-skip">Passer →</button>
</div>

<!-- Cinématique -->
<div class="cinematic" id="cinematic" hidden>
  <div class="cin-bars"></div>
  <div class="cin-content">
    <div class="cin-overline" id="cin-overline"></div>
    <h1 class="cin-title" id="cin-title"></h1>
    <p class="cin-sub" id="cin-sub"></p>
    <div class="cin-event" id="cin-event"></div>
    <div class="cin-hint" id="cin-hint"></div>
  </div>
  <div class="cin-progress"><i id="cin-bar"></i></div>
  <button class="skip" id="cin-skip">Passer →</button>
</div>

<!-- Combat -->
<div class="battle" id="battle" hidden></div>

</body>
</html>
